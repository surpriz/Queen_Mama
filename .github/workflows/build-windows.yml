name: Build Windows App

on:
  push:
    tags:
      - 'win/v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version (e.g., 1.0.0 or 1.0.0-beta.1)'
        required: true
        default: '1.0.0'
      prerelease:
        description: 'Pre-release (for staging)'
        type: boolean
        default: false

concurrency:
  group: build-windows-${{ github.ref }}
  cancel-in-progress: false  # Never cancel in-progress builds

defaults:
  run:
    working-directory: win_app_2

jobs:
  test:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: win_app_2/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npm run typecheck

      - name: Run tests
        run: npm test

  build:
    needs: [test]
    runs-on: windows-latest
    timeout-minutes: 30
    permissions:
      contents: write
    outputs:
      tag_name: ${{ steps.release_type.outputs.tag_name }}
      is_prerelease: ${{ steps.release_type.outputs.is_prerelease }}
      installer_name: ${{ steps.installer.outputs.installer_name }}
      version: ${{ steps.installer.outputs.version }}
      build_number: ${{ steps.build_number.outputs.next_build }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: win_app_2/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Determine release type
        id: release_type
        shell: bash
        run: |
          RAW_TAG="${GITHUB_REF_NAME:-${{ github.event.inputs.version }}}"
          # Strip platform prefix (win/v1.0.0 → v1.0.0)
          TAG_NAME="${RAW_TAG#win/}"
          echo "tag_name=$TAG_NAME" >> $GITHUB_OUTPUT

          # Check if it's a pre-release (contains -beta, -rc, -alpha, etc.)
          if [[ "$TAG_NAME" =~ -(beta|rc|alpha|dev) ]] || [[ "${{ github.event.inputs.prerelease }}" == "true" ]]; then
            echo "is_prerelease=true" >> $GITHUB_OUTPUT
            echo "Building PRE-RELEASE: $TAG_NAME"
          else
            echo "is_prerelease=false" >> $GITHUB_OUTPUT
            echo "Building PRODUCTION RELEASE: $TAG_NAME"
          fi

      - name: Calculate build number
        id: build_number
        shell: bash
        run: |
          NEXT_BUILD=$(( ${{ github.run_number }} + 50 ))
          echo "next_build=$NEXT_BUILD" >> $GITHUB_OUTPUT
          echo "Build number: $NEXT_BUILD (from run_number ${{ github.run_number }})"

      - name: Update package.json version
        shell: bash
        run: |
          TAG_NAME="${{ steps.release_type.outputs.tag_name }}"
          VERSION="${TAG_NAME#v}"
          npm version "$VERSION" --no-git-tag-version --allow-same-version
          echo "Updated package.json to version $VERSION"

      - name: Build app
        run: npm run build
        env:
          VITE_APP_ENV: ${{ steps.release_type.outputs.is_prerelease == 'true' && 'staging' || 'production' }}
          VITE_SENTRY_DSN: ${{ secrets.SENTRY_DSN_WINDOWS }}
          SENTRY_DSN: ${{ secrets.SENTRY_DSN_WINDOWS }}

      - name: Package with electron-builder
        run: npx electron-builder --win --publish never
        env:
          SENTRY_DSN: ${{ secrets.SENTRY_DSN_WINDOWS }}

      - name: Rename installer
        id: installer
        shell: bash
        run: |
          TAG_NAME="${{ steps.release_type.outputs.tag_name }}"
          VERSION="${TAG_NAME#v}"

          # Find the generated installer
          INSTALLER=$(find release -name "*.exe" -type f | head -1)
          if [ -z "$INSTALLER" ]; then
            echo "ERROR: No .exe installer found in release/"
            ls -la release/
            exit 1
          fi

          # Rename to standard format
          mv "$INSTALLER" "release/QueenMama-Setup-${VERSION}.exe"
          echo "installer_name=QueenMama-Setup-${VERSION}.exe" >> $GITHUB_OUTPUT
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "Installer: QueenMama-Setup-${VERSION}.exe"

      - name: Upload unsigned installer
        uses: actions/upload-artifact@v4
        with:
          name: unsigned-installer
          path: win_app_2/release/${{ steps.installer.outputs.installer_name }}
          retention-days: 7

      - name: Upload latest.yml
        uses: actions/upload-artifact@v4
        continue-on-error: true
        with:
          name: latest-yml
          path: win_app_2/release/latest.yml
          retention-days: 1
          if-no-files-found: warn

      - name: Upload Sentry release
        if: ${{ vars.SENTRY_ORG != '' && vars.SENTRY_PROJECT_WINDOWS != '' }}
        continue-on-error: true
        shell: bash
        env:
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          SENTRY_ORG: ${{ vars.SENTRY_ORG }}
          SENTRY_PROJECT: ${{ vars.SENTRY_PROJECT_WINDOWS }}
        run: |
          VERSION="${{ steps.installer.outputs.version }}"
          BUILD_NUMBER="${{ steps.build_number.outputs.next_build }}"

          npm install -g @sentry/cli

          echo "Creating Sentry release ${VERSION}+${BUILD_NUMBER}..."
          sentry-cli releases new "${VERSION}+${BUILD_NUMBER}"

          echo "Associating commits..."
          sentry-cli releases set-commits "${VERSION}+${BUILD_NUMBER}" --auto --ignore-missing

          echo "Uploading source maps..."
          sentry-cli sourcemaps upload --release "${VERSION}+${BUILD_NUMBER}" out/ || true

          echo "Finalizing release..."
          sentry-cli releases finalize "${VERSION}+${BUILD_NUMBER}"

          if [[ "${{ steps.release_type.outputs.is_prerelease }}" == "true" ]]; then
            sentry-cli releases deploys "${VERSION}+${BUILD_NUMBER}" new -e staging
          else
            sentry-cli releases deploys "${VERSION}+${BUILD_NUMBER}" new -e production
          fi

  sign:
    needs: [build]
    runs-on: [self-hosted, Windows]
    timeout-minutes: 15
    defaults:
      run:
        working-directory: .
    permissions:
      contents: write
    steps:
      - name: Clean workspace
        shell: powershell
        run: |
          if (Test-Path unsigned) { Remove-Item unsigned -Recurse -Force }

      - name: Download unsigned installer
        uses: actions/download-artifact@v4
        with:
          name: unsigned-installer
          path: unsigned

      - name: Authenticate SimplySign
        shell: powershell
        env:
          CERTUM_OTP_URI: ${{ secrets.CERTUM_OTP_URI }}
          CERTUM_USERID: ${{ secrets.CERTUM_USERID }}
        run: |
          Add-Type -Language CSharp @"
          using System;
          using System.Security.Cryptography;
          public static class TotpGen {
              private static byte[] Base32Decode(string b32) {
                  b32 = b32.TrimEnd('=').ToUpperInvariant();
                  int bc = b32.Length * 5 / 8;
                  byte[] r = new byte[bc]; byte cb = 0; int br = 8; int ai = 0;
                  const string a = "ABCDEFGHIJKLMNOPQRSTUVWXYZ234567";
                  foreach (char c in b32) {
                      int v = a.IndexOf(c); if (v < 0) throw new ArgumentException("Bad char");
                      if (br > 5) { cb = (byte)(cb | (v << (br - 5))); br -= 5; }
                      else { cb = (byte)(cb | (v >> (5 - br))); r[ai++] = cb; cb = (byte)((v << (3 + br)) & 0xFF); br += 3; }
                  }
                  if (ai < bc) r[ai] = cb; return r;
              }
              public static string Gen(string secret, int digits, int period, string algo) {
                  byte[] key = Base32Decode(secret);
                  long ctr = (long)(DateTime.UtcNow - new DateTime(1970,1,1,0,0,0,DateTimeKind.Utc)).TotalSeconds / period;
                  byte[] cb = BitConverter.GetBytes(ctr);
                  if (BitConverter.IsLittleEndian) Array.Reverse(cb);
                  byte[] h;
                  if (algo == "SHA256") { using (var hm = new HMACSHA256(key)) { h = hm.ComputeHash(cb); } }
                  else { using (var hm = new HMACSHA1(key)) { h = hm.ComputeHash(cb); } }
                  int o = h[h.Length-1] & 0x0F;
                  int bin = ((h[o]&0x7F)<<24)|((h[o+1]&0xFF)<<16)|((h[o+2]&0xFF)<<8)|(h[o+3]&0xFF);
                  return (bin % (int)Math.Pow(10, digits)).ToString().PadLeft(digits, '0');
              }
          }
          "@

          # Parse OTP URI
          $secret = [regex]::Match($env:CERTUM_OTP_URI, 'secret=([A-Z2-7=]+)').Groups[1].Value
          $algo = if ([regex]::Match($env:CERTUM_OTP_URI, 'algorithm=(\w+)').Success) { [regex]::Match($env:CERTUM_OTP_URI, 'algorithm=(\w+)').Groups[1].Value } else { "SHA1" }
          $digits = if ([regex]::Match($env:CERTUM_OTP_URI, 'digits=(\d+)').Success) { [int][regex]::Match($env:CERTUM_OTP_URI, 'digits=(\d+)').Groups[1].Value } else { 6 }
          $period = if ([regex]::Match($env:CERTUM_OTP_URI, 'period=(\d+)').Success) { [int][regex]::Match($env:CERTUM_OTP_URI, 'period=(\d+)').Groups[1].Value } else { 30 }

          # Wait for good TOTP window
          $remaining = $period - ([DateTimeOffset]::UtcNow.ToUnixTimeSeconds() % $period)
          if ($remaining -lt 10) { Start-Sleep -Seconds ($remaining + 1) }

          $totp = [TotpGen]::Gen($secret, $digits, $period, $algo)
          Write-Host "TOTP generated ($algo)"

          # Kill and restart SimplySign to get a fresh login dialog
          # (CSP sessions expire after ~2h, stale sessions cause signing failures)
          Write-Host "Restarting SimplySign Desktop for fresh authentication..."
          Get-Process -Name "SimplySignDesktop" -ErrorAction SilentlyContinue | Stop-Process -Force
          Start-Sleep -Seconds 3
          Start-Process "C:\Program Files\Certum\SimplySign Desktop\SimplySignDesktop.exe"
          Start-Sleep -Seconds 10

          Write-Host "Certificate not in store yet, sending credentials..."
          Add-Type -AssemblyName System.Windows.Forms
          $wshell = New-Object -ComObject WScript.Shell

          $authenticated = $false
          for ($i = 1; $i -le 10; $i++) {
            if ($wshell.AppActivate("SimplySign")) {
              Start-Sleep -Milliseconds 500
              $wshell.SendKeys($env:CERTUM_USERID)
              $wshell.SendKeys("{TAB}")
              Start-Sleep -Milliseconds 200
              $wshell.SendKeys($totp)
              $wshell.SendKeys("{ENTER}")
              Write-Host "Credentials sent to SimplySign"
              $authenticated = $true
              break
            }
            Write-Host "Waiting for SimplySign window (attempt $i/10)..."
            Start-Sleep -Seconds 3
          }

          if ($authenticated) {
            Start-Sleep -Seconds 15
            Write-Host "SimplySign authentication complete"
          } else {
            Write-Host "WARNING: Could not find SimplySign login window (may already be authenticated)"
          }

      - name: Sign installer with Certum EV
        shell: powershell
        env:
          CERTUM_THUMBPRINT: ${{ secrets.CERTUM_THUMBPRINT }}
        run: |
          # Find signtool
          $signtool = Get-ChildItem -Path "C:\Program Files (x86)\Windows Kits" -Recurse -Filter "signtool.exe" -ErrorAction SilentlyContinue |
                      Where-Object { $_.FullName -like "*x64*" } |
                      Select-Object -First 1 -ExpandProperty FullName

          if (-not $signtool) {
            # Try common Windows SDK paths
            $paths = @(
              "C:\Program Files (x86)\Windows Kits\10\bin\10.0.19041.0\x64\signtool.exe",
              "C:\Program Files (x86)\Windows Kits\10\bin\x64\signtool.exe"
            )
            foreach ($p in $paths) { if (Test-Path $p) { $signtool = $p; break } }
          }

          if (-not $signtool) {
            Write-Host "ERROR: signtool.exe not found. Install Windows SDK on the runner."
            Write-Host "Run: winget install -e --id Microsoft.WindowsSDK.10.0.22621"
            exit 1
          }

          Write-Host "Using signtool: $signtool"

          # Sign the installer
          $installer = Get-ChildItem -Path unsigned -Filter "*.exe" | Select-Object -First 1
          if (-not $installer) {
            Write-Host "ERROR: No .exe found in unsigned/"
            exit 1
          }

          Write-Host "Signing $($installer.Name)..."
          & $signtool sign /sha1 $env:CERTUM_THUMBPRINT /fd sha256 /tr http://time.certum.pl /td sha256 /v $installer.FullName

          if ($LASTEXITCODE -ne 0) {
            Write-Host "ERROR: Signing failed"
            Write-Host "Debug: listing certificates..."
            & $signtool sign /debug /sha1 $env:CERTUM_THUMBPRINT /fd sha256 /v $installer.FullName 2>&1
            exit 1
          }

          Write-Host "Verifying signature..."
          & $signtool verify /pa /v $installer.FullName
          Write-Host "Signature verified successfully!"

      - name: Upload signed installer
        uses: actions/upload-artifact@v4
        with:
          name: signed-installer
          path: unsigned/
          retention-days: 1

  release:
    needs: [build, sign]
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: .
    permissions:
      contents: write
    steps:
      - name: Download signed installer
        uses: actions/download-artifact@v4
        with:
          name: signed-installer
          path: release

      - name: Download latest.yml
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: latest-yml
          path: release

      - name: Regenerate latest.yml with signed installer hash
        shell: bash
        run: |
          INSTALLER="release/${{ needs.build.outputs.installer_name }}"
          if [ ! -f "$INSTALLER" ]; then
            echo "ERROR: Signed installer not found"
            exit 1
          fi

          # Compute sha512 of the SIGNED installer
          SHA512=$(sha512sum "$INSTALLER" | awk '{print $1}' | xxd -r -p | base64 -w 0)
          SIZE=$(stat --format=%s "$INSTALLER")
          VERSION="${{ needs.build.outputs.version }}"
          DATE=$(date -u +"%Y-%m-%dT%H:%M:%S.000Z")

          echo "Signed installer: $INSTALLER"
          echo "SHA512: $SHA512"
          echo "Size: $SIZE (was $(grep -oP 'size: \K\d+' release/latest.yml 2>/dev/null || echo 'unknown') before signing)"

          # Regenerate latest.yml with correct hash for the signed binary
          cat > release/latest.yml << YAML
          version: ${VERSION}
          files:
            - url: ${{ needs.build.outputs.installer_name }}
              sha512: ${SHA512}
              size: ${SIZE}
          path: ${{ needs.build.outputs.installer_name }}
          sha512: ${SHA512}
          releaseDate: '${DATE}'
          YAML

          # Remove leading whitespace (heredoc indentation)
          sed -i 's/^          //' release/latest.yml

          echo "--- Generated latest.yml ---"
          cat release/latest.yml

      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          files: |
            release/${{ needs.build.outputs.installer_name }}
            release/latest.yml
          prerelease: ${{ needs.build.outputs.is_prerelease }}
          tag_name: ${{ github.ref_name }}
          name: "Queen Mama Windows ${{ needs.build.outputs.tag_name }}"
          body: |
            ## Queen Mama Windows ${{ needs.build.outputs.tag_name }}

            ${{ needs.build.outputs.is_prerelease == 'true' && '**PRE-RELEASE** - Pour tests uniquement (staging.queenmama.co)' || '**PRODUCTION RELEASE** - Version stable (queenmama.co)' }}

            **Signature:** EV Code Signing (JAAP v2 - Certum)
            **Installation:** Lancer l'installateur, suivre l'assistant.
            **Requis:** Windows 10+ (64-bit)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
