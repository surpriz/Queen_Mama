name: Tests Windows

on:
  push:
    branches: [main, staging]
    paths:
      - 'win_app_2/**'
  pull_request:
    branches: [main, staging]
    paths:
      - 'win_app_2/**'
  workflow_dispatch:

concurrency:
  group: test-windows-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: win_app_2

jobs:
  test:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: win_app_2/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npm run typecheck

      - name: Run tests
        run: npm test

      - name: Test Summary
        if: always()
        shell: bash
        run: |
          echo "## Test Results" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Platform: Windows" >> $GITHUB_STEP_SUMMARY
          echo "Node.js: 20" >> $GITHUB_STEP_SUMMARY
