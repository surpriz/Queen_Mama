name: Build Electron Mac

on:
  push:
    tags:
      - 'electron-mac/v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version (e.g., 1.0.0 or 1.0.0-beta.1)'
        required: true
        default: '1.0.0'
      prerelease:
        description: 'Pre-release (for staging)'
        type: boolean
        default: false

concurrency:
  group: build-electron-mac-${{ github.ref }}
  cancel-in-progress: false  # Never cancel in-progress builds

defaults:
  run:
    working-directory: win_app_2

jobs:
  test:
    runs-on: macos-14
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: win_app_2/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npm run typecheck

      - name: Run tests
        run: npm test

  build:
    needs: [test]
    runs-on: macos-14
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: win_app_2/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Determine release type
        id: release_type
        shell: bash
        run: |
          RAW_TAG="${GITHUB_REF_NAME:-${{ github.event.inputs.version }}}"
          # Strip platform prefix (electron-mac/v1.0.0 → v1.0.0)
          TAG_NAME="${RAW_TAG#electron-mac/}"
          echo "tag_name=$TAG_NAME" >> $GITHUB_OUTPUT

          # Check if it's a pre-release (contains -beta, -rc, -alpha, etc.)
          if [[ "$TAG_NAME" =~ -(beta|rc|alpha|dev) ]] || [[ "${{ github.event.inputs.prerelease }}" == "true" ]]; then
            echo "is_prerelease=true" >> $GITHUB_OUTPUT
            echo "Building PRE-RELEASE: $TAG_NAME"
          else
            echo "is_prerelease=false" >> $GITHUB_OUTPUT
            echo "Building PRODUCTION RELEASE: $TAG_NAME"
          fi

      - name: Calculate build number
        id: build_number
        shell: bash
        run: |
          NEXT_BUILD=$(( ${{ github.run_number }} + 50 ))
          echo "next_build=$NEXT_BUILD" >> $GITHUB_OUTPUT
          echo "Build number: $NEXT_BUILD (from run_number ${{ github.run_number }})"

      - name: Update package.json version
        shell: bash
        run: |
          TAG_NAME="${{ steps.release_type.outputs.tag_name }}"
          VERSION="${TAG_NAME#v}"
          npm version "$VERSION" --no-git-tag-version --allow-same-version
          echo "Updated package.json to version $VERSION"

      - name: Install Certificate
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
        run: |
          KEYCHAIN_PATH=$RUNNER_TEMP/app-signing.keychain-db

          # Create temporary keychain
          security create-keychain -p "$KEYCHAIN_PASSWORD" $KEYCHAIN_PATH
          security set-keychain-settings -lut 21600 $KEYCHAIN_PATH
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" $KEYCHAIN_PATH

          # Import certificate
          echo -n "$APPLE_CERTIFICATE" | base64 --decode -o $RUNNER_TEMP/certificate.p12
          security import $RUNNER_TEMP/certificate.p12 \
            -P "$APPLE_CERTIFICATE_PASSWORD" \
            -A \
            -t cert \
            -f pkcs12 \
            -k $KEYCHAIN_PATH

          # Add to keychain search list and set as default
          security list-keychain -d user -s $KEYCHAIN_PATH $(security list-keychains -d user | sed 's/"//g')
          security default-keychain -s $KEYCHAIN_PATH

          # Set partition list
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" $KEYCHAIN_PATH

          # Verify certificate is available
          echo "Available signing identities:"
          security find-identity -v -p codesigning $KEYCHAIN_PATH

      - name: Build app
        run: npm run build
        env:
          VITE_APP_ENV: ${{ steps.release_type.outputs.is_prerelease == 'true' && 'staging' || 'production' }}

      - name: Package with electron-builder
        run: npx electron-builder --mac --arm64 --publish never
        env:
          CSC_LINK: ${{ secrets.APPLE_CERTIFICATE }}
          CSC_KEY_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}

      - name: Rename DMG
        id: dmg
        shell: bash
        run: |
          TAG_NAME="${{ steps.release_type.outputs.tag_name }}"
          VERSION="${TAG_NAME#v}"

          # Find the generated DMG
          DMG=$(find release -name "*.dmg" -type f | head -1)
          if [ -z "$DMG" ]; then
            echo "ERROR: No .dmg found in release/"
            ls -la release/
            exit 1
          fi

          # Rename to standard format
          mv "$DMG" "release/QueenMama-Electron-${VERSION}.dmg"
          echo "dmg_name=QueenMama-Electron-${VERSION}.dmg" >> $GITHUB_OUTPUT
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "DMG: QueenMama-Electron-${VERSION}.dmg"

      - name: Upload Sentry release
        if: ${{ vars.SENTRY_ORG != '' && vars.SENTRY_PROJECT_WINDOWS != '' }}
        continue-on-error: true
        shell: bash
        env:
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          SENTRY_ORG: ${{ vars.SENTRY_ORG }}
          SENTRY_PROJECT: ${{ vars.SENTRY_PROJECT_WINDOWS }}
        run: |
          VERSION="${{ steps.dmg.outputs.version }}"
          BUILD_NUMBER="${{ steps.build_number.outputs.next_build }}"

          npm install -g @sentry/cli

          echo "Creating Sentry release ${VERSION}+${BUILD_NUMBER}..."
          sentry-cli releases new "${VERSION}+${BUILD_NUMBER}"

          echo "Associating commits..."
          sentry-cli releases set-commits "${VERSION}+${BUILD_NUMBER}" --auto --ignore-missing

          echo "Finalizing release..."
          sentry-cli releases finalize "${VERSION}+${BUILD_NUMBER}"

          if [[ "${{ steps.release_type.outputs.is_prerelease }}" == "true" ]]; then
            sentry-cli releases deploys "${VERSION}+${BUILD_NUMBER}" new -e staging
          else
            sentry-cli releases deploys "${VERSION}+${BUILD_NUMBER}" new -e production
          fi

      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          files: win_app_2/release/${{ steps.dmg.outputs.dmg_name }}
          prerelease: ${{ steps.release_type.outputs.is_prerelease }}
          tag_name: ${{ github.ref_name }}
          name: "Queen Mama Electron Mac ${{ steps.release_type.outputs.tag_name }}"
          body: |
            ## Queen Mama Electron Mac ${{ steps.release_type.outputs.tag_name }}

            ${{ steps.release_type.outputs.is_prerelease == 'true' && '**PRE-RELEASE** - Pour tests uniquement (staging.queenmama.co)' || '**PRODUCTION RELEASE** - Version stable (queenmama.co)' }}

            **Installation:** Télécharger le DMG, glisser dans Applications.
            **Requis:** macOS 12+ (Apple Silicon arm64)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Cleanup
        if: always()
        run: security delete-keychain $RUNNER_TEMP/app-signing.keychain-db || true
