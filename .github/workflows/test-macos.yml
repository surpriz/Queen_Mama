name: Tests macOS

on:
  push:
    branches: [main, staging]
    paths:
      - 'mac_app/**'
      - 'QueenMamaTests/**'
      - 'QueenMama.xcodeproj/**'
  pull_request:
    branches: [main, staging]
    paths:
      - 'mac_app/**'
      - 'QueenMamaTests/**'
      - 'QueenMama.xcodeproj/**'

env:
  SCHEME: QueenMama
  XCODE_PROJECT: QueenMama.xcodeproj

jobs:
  test:
    runs-on: macos-14
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_16.2.app

      - name: Build & Run Tests
        run: |
          xcodebuild test \
            -project $XCODE_PROJECT \
            -scheme $SCHEME \
            -destination 'platform=macOS' \
            -only-testing:QueenMamaTests \
            -resultBundlePath TestResults.xcresult \
            CODE_SIGN_IDENTITY=- \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            -skipPackagePluginValidation \
            -skipMacroValidation \
            | tee test-output.log \
            | tail -50

      - name: Test Summary
        if: always()
        run: |
          echo "## Test Results" >> $GITHUB_STEP_SUMMARY
          if grep -q "TEST SUCCEEDED" test-output.log; then
            echo "✅ **All tests passed**" >> $GITHUB_STEP_SUMMARY
          else
            echo "❌ **Tests failed**" >> $GITHUB_STEP_SUMMARY
          fi
          echo "" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          grep "Test case\|Test suite\|TEST " test-output.log >> $GITHUB_STEP_SUMMARY || true
          echo '```' >> $GITHUB_STEP_SUMMARY
