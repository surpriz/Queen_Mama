appId: com.queenmama.windows
productName: Queen Mama Electron
copyright: Copyright © 2026 Queen Mama
directories:
  output: release
  buildResources: resources
files:
  - out/**/*
  - package.json
  - resources/**/*
win:
  target:
    - target: nsis
      arch:
        - x64
  icon: resources/icon.ico
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  deleteAppDataOnUninstall: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
mac:
  target:
    - target: dmg
      arch:
        - x64
        - arm64
  icon: resources/icon.icns
  category: public.app-category.productivity
  hardenedRuntime: true
  entitlements: resources/entitlements.mac.plist
  entitlementsInherit: resources/entitlements.mac.plist
  notarize: true
# Auto-update feed. Points at a rolling "windows-latest" GitHub release tag
# instead of queenmama.co: corporate proxies (Zscaler, Netskope, etc.) often
# block the uncategorized queenmama.co domain, returning an HTML block page
# that breaks the updater. github.com / objects.githubusercontent.com are
# almost always whitelisted. We use a fixed rolling tag rather than the github
# provider so cross-platform releases (macOS/iOS) never steal GitHub's global
# "latest" and 404 the Windows feed.
publish:
  provider: generic
  url: https://github.com/surpriz/Queen_Mama/releases/download/windows-latest
